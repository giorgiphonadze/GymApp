# PROD: production PostgreSQL. Credentials MUST be supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://prod-db.gymcrm.internal:5432/gymcrm_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gymcrm_prod}
spring.datasource.password=${DB_PASSWORD:}

# The schema is managed outside of the application in production; it is only validated here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.com.gymcrm=INFO

# No fallback: the application refuses to start without a JWT_SECRET.
gym.security.jwt.secret=${JWT_SECRET}
