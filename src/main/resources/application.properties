# Common settings shared by every environment.
# Environment specific settings live in application-{local|dev|stg|prod}.properties.
# The "local" profile is used when no profile is requested (e.g. -Dspring.profiles.active=dev).
spring.application.name=gym-crm
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT issued by POST /auth/login. The secret must be at least 32 characters (HS256).
# The default below is for local development only; dev/stg/prod MUST set JWT_SECRET.
gym.security.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-0123456789}
gym.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
info.app.name=${spring.application.name}
