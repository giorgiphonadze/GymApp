# DEV: shared development PostgreSQL. Credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gymcrm_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gymcrm_dev}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.gymcrm=DEBUG
