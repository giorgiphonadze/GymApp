# STG: staging PostgreSQL. Credentials are supplied through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://stg-db.gymcrm.internal:5432/gymcrm_stg}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:gymcrm_stg}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.gymcrm=INFO

# No fallback: the application refuses to start without a JWT_SECRET.
gym.security.jwt.secret=${JWT_SECRET}
